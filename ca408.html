<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    img {
      max-width: 99%;
      max-height: 99%;
      object-fit: contain;
      user-select: none;
    }

    hr {
      height: 3px !important;
      margin: 0px !important;
    }
  </style>
  <script>
    function reloadImages() {
      const timestamp = new Date().getTime();
      <!-- document.getElementById('img1').src = "https://tcnvr5.taichung.gov.tw/408095ee?t=" + timestamp; -->
      <!-- document.getElementById('img2').src = "https://tcnvr6.taichung.gov.tw/567c2768?t=" + timestamp; -->
      document.getElementById('img1').src = "https://tcnvr5.taichung.gov.tw/408095ee";
      document.getElementById('img2').src = "https://tcnvr6.taichung.gov.tw/567c2768";
    }

    setInterval(reloadImages, 30000); // 30秒
  </script>
</head>
<body>
  <img id="img1" src="https://tcnvr5.taichung.gov.tw/408095ee" alt="Camera Feed">
  <hr/>
  <img id="img2" src="https://tcnvr6.taichung.gov.tw/567c2768" alt="Camera Feed">
</body>
</html>
