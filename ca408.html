<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="90">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
    }

    body {
      overflow: hidden; /* 防止捲軸出現 */
    }

    img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
    }
  </style>
</head>
<body>
  <img src="https://tcnvr5.taichung.gov.tw/408095ee" alt="Camera Feed">
</body>
</html>
